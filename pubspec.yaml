name: eazyvault
description: Smart Finance Starts Here - A production-ready Personal Finance Management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.5
  firebase_analytics: ^10.10.5
  firebase_crashlytics: ^3.5.5
  google_sign_in: ^6.2.1

  # Routing
  go_router: ^14.1.4

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Export
  pdf: ^3.11.1
  printing: ^5.13.4

  # Utilities
  logger: ^2.3.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  fake_cloud_firestore: ^2.5.2
  firebase_auth_mocks: ^0.13.0

flutter:
  uses-material-design: true

  assets:
    - eazyvault_logo.png
    - avail404.png
