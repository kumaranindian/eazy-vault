targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Run build_runner with --delete-conflicting-outputs to use this option
          # This will delete any existing .freezed.dart files before generating new ones
          runs_before:
            - json_serializable
      json_serializable:
        enabled: true
        options:
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: true
      riverpod_generator:
        enabled: true
